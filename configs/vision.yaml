# Parámetros del módulo de visión. Todos los umbrales viven aquí, no en el código.
# Definición de clases y métricas: docs/output_contract.md

sampling:
  sample_fps: 2.0                # frames analizados por segundo de video

models:
  teacher_weights: weights/teacher.pt
  behavior_weights: weights/behavior.pt
  pose_weights: yolov8n-pose.pt  # solo se usa si pose.enabled es true
  tracker_config: bytetrack.yaml
  # 960 y no 640: con cámara al fondo el docente sale pequeño. En una clase real (fragmento
  # de 5 min) lo encontró en el 98 % de los frames contra el 80 % con 640, en el mismo tiempo.
  image_size: 960

teacher:
  detection_conf: 0.25           # confianza mínima para que el detector guarde una caja
  # En cada frame, el docente es la caja "teacher" más confiable, si supera este mínimo.
  # (Antes se elegía el track que más aparecía, y en una clase real eso eligió a un alumno quieto.)
  teacher_min_conf: 0.7
  similar_conf_margin: 0.1       # cajas a menos de esto en confianza: gana la más cercana a la última posición
  gap_fill_s: 3.0                # si el docente se pierde menos que esto, se mantiene su último estado (interpolado)
  # Clase que se toma como docente. Con el modelo genérico de COCO (prueba sin pesos propios)
  # se cambia a "person".
  class_name: teacher

behavior:
  detection_conf: 0.25           # VER guarda todas las cajas desde aquí; los umbrales de abajo son al INTERPRETAR
  behavior_iou_threshold: 0.3    # solape mínimo entre la caja de conducta y la del docente
  # Umbrales elegidos mirando, caja por caja, dos fragmentos de un aula peruana en 720p:
  # - board_writing >= 0.6: arriba, la docente escribiendo en la pizarra; abajo (0.40-0.45), la
  #   docente con la mano levantada.
  # - guide >= 0.65: arriba (0.68-0.82), la docente entre las carpetas con una hoja; abajo, una
  #   alumna escribiendo (0.62) o la docente solo parada hablando.
  # Igual son EXPERIMENTALES: el modelo se entrenó con aulas de otro país y casi no reconoce
  # estas conductas en aulas peruanas (ver README, Limitaciones).
  guide_class: guide
  guide_min_conf: 0.65           # guide solo cuenta con esta confianza mínima...
  min_guide_s: 2.0               # ...y si dura al menos esto (estar parado junto a una carpeta no es guiar)
  board_writing_class: board_writing
  board_writing_min_conf: 0.6
  # Evento de alumnos: nunca se asigna al docente, se cuenta como evento (R1).
  stage_interaction_class: stage_interaction
  # Clases que se ignoran al interpretar. "answer" cae sobre la docente explicando, incluso
  # con 0.93 de confianza, y nunca sobre un alumno respondiendo: ningún umbral la arregla.
  ignored_classes: [answer]

pose:
  # Desactivado: con el docente pequeño y de espaldas, la pose "ve" la cara y se equivoca.
  # El código se conserva para trabajos futuros; no forma parte del flujo actual.
  enabled: false
  detection_conf: 0.25
  match_iou_threshold: 0.3
  face_kp_conf: 0.5
  shoulder_kp_conf: 0.5

timeline:
  smoothing_window_s: 3.0        # ventana del voto mayoritario
  min_segment_s: 1.5             # segmentos más cortos se unen con su vecino

path:
  median_window_frames: 5        # mediana móvil sobre el punto de los pies (quita temblor de la caja)
  # Un paso mayor a esta fracción del ancho del frame entre dos frames muestreados no es una
  # caminata real (cambio de identidad o error del detector): se descarta y se cuenta.
  max_step_ratio: 0.25

heatmap:
  grid_columns: 8
  grid_rows: 6
  background_blur_kernel: 151    # impar y grande: el fondo no debe permitir reconocer a nadie
  heat_blur_kernel: 61           # suaviza el calor para que se vea como zonas y no como puntos
  overlay_alpha: 0.6             # peso del calor sobre el fondo desenfocado

debug_video:
  box_thickness: 2
  font_scale: 0.7
