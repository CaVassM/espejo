[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "espejo"
version = "0.1.0"
description = "Retroalimentación para docentes a partir del video de su clase"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]
extend-exclude = ["data", "runs", "outputs", "weights", "samples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]
# SIM110 pide reemplazar bucles por any()/all(); el equipo prefiere el bucle explícito
ignore = ["SIM110"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
