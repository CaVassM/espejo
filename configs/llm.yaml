# Módulo LLM: entiende el significado de lo que dice el docente. Solo recibe TEXTO
# (transcripción y métricas), nunca audio ni video. No pone notas: marca evidencias con su cita.

provider: cohere                 # cohere | ollama | anthropic | none
definitions_path: docs/rubric_definitions.md   # parte fija del prompt, fiel al manual del Minedu
max_attempts: 2                  # si la respuesta no es un JSON válido, se reintenta una vez

ollama:
  host: http://localhost:11434
  # "auto": qwen2.5:14b con 12 GB de VRAM o más; si no, qwen2.5:7b (ambos manejan bien español y JSON)
  model: auto
  large_model: qwen2.5:14b
  small_model: qwen2.5:7b
  min_vram_gb_for_large: 12
  temperature: 0
  # Ventana de contexto de Ollama: una ventana de 3 min son ~5.700 tokens de prompt (incluidas
  # las definiciones) más ~2.500 de respuesta. Con 8192 Ollama recortaba el inicio sin avisar.
  context_tokens: 12288
  request_timeout_s: 600

anthropic:
  model: claude-sonnet-5-5
  api_key_env_var: ANTHROPIC_API_KEY   # se lee de .env; si no está, el proveedor no está disponible
  max_tokens: 16000
  # claude-sonnet-5-5 no acepta temperature: el control de variabilidad es el esquema JSON.
  # Respaldo del lado del servidor si el modelo rechaza la solicitud (Claude API).
  fallback_beta: server-side-fallback-2026-07-01
  input_usd_per_million_tokens: 2.0
  output_usd_per_million_tokens: 10.0

cohere:
  # Command A (03-2025): JSON con esquema, 256k de contexto, hasta 8k de respuesta y multilingüe
  # (español incluido). Command A+ es más nuevo, pero Cohere pide contactar a ventas para usarlo
  # en producción; Command R y R+ antiguos quedaron obsoletos (sept. 2025).
  model: command-a-03-2025
  api_key_env_var: COHERE_API_KEY  # se lee de .env; si no está, el proveedor no está disponible
  temperature: 0
  max_tokens: 8000
  request_timeout_s: 120
  # Key de prueba (gratis): 20 llamados por minuto y 1.000 al mes. Se espera lo necesario
  # entre llamados y, si igual llega un "demasiadas peticiones", se reintenta.
  max_calls_per_minute: 20
  rate_limit_retries: 2
  rate_limit_wait_s: 30
  # La key de prueba no cobra. Con una key de producción, pon aquí los precios de cohere.com/pricing
  input_usd_per_million_tokens: 0.0
  output_usd_per_million_tokens: 0.0
  # Con 256k de contexto alcanzan ventanas de 10 min: ~11 a 16 llamados por clase de 45 min
  windows:
    window_s: 600
    overlap_s: 20

windows:
  window_s: 180                  # ventanas de ~3 min...
  overlap_s: 20                  # ...con 20 s de solapamiento para no cortar intercambios

validation:
  timestamp_tolerance_s: 2.0     # una cita debe existir en la transcripción a ±2 s del minuto indicado
  # Una invitación a participar debe dirigirse a UN estudiante (su nombre, "hija", "a ver tú").
  # Si la palabra con que se dirige es una de estas, la pregunta es a toda la clase y no cuenta.
  whole_class_words: [ustedes, todos, todas, chicos, chicas, niños, niñas, alumnos, estudiantes,
                      clase, grupo, salón]

suggestion:
  context_s: 30                  # líneas de la transcripción a ±30 s del momento citado en el consejo
