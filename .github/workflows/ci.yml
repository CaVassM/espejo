name: CI

# Estilo y tests en cada push y pull request. Solo dependencias livianas: los tests no usan GPU,
# ni modelos, ni Modal. También lo reutiliza deploy-modal.yml antes de desplegar.
on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias livianas (motor sin extras, API y worker web)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e engine ruff
          (cd services/api && python -m pip install -r requirements-dev.txt)
          python -m pip install -r services/worker/requirements-dev.txt

      - name: Estilo
        run: |
          ruff check .
          ruff format --check .

      - name: Tests del motor
        run: python -m pytest engine/tests -q

      - name: Tests de la API
        working-directory: services/api
        run: python -m pytest -q

      - name: Tests del worker
        working-directory: services/worker
        run: python -m pytest -q
