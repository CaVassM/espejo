# Parámetros del módulo de audio. Todos los umbrales viven aquí, no en el código.

extraction:
  sample_rate_hz: 16000          # Whisper y Silero VAD trabajan a 16 kHz mono
  vad_highpass_hz: 100           # filtro suave solo para la copia del VAD; Whisper recibe audio crudo

transcription:
  language: es
  # "auto": GPU con gpu_model si está libre; si está ocupada (p. ej. entrenando) o no hay, CPU.
  # También acepta "cuda" o "cpu" para forzar.
  device: auto
  gpu_model: large-v3-turbo
  gpu_fallback_model: medium     # si gpu_model no está disponible en esta versión de faster-whisper
  gpu_compute_type: float16
  cpu_model: small
  cpu_compute_type: int8
  min_free_gpu_memory_gb: 3.0    # Whisper turbo usa ~2 GB; con menos libre, la GPU está ocupada
  beam_size: 5
  # Sin condicionar en el texto previo, Whisper repite menos frases en bucle en tramos de ruido
  condition_on_previous_text: false
  # Texto de inicio para Whisper (initial_prompt), antes del tema. Whisper imita su estilo:
  # con preguntas bien puntuadas mantiene los signos "¿?" y las tildes. Sin esto, en otra GPU
  # transcribió "donde habrá sucedido" en vez de "¿Dónde habrá sucedido?" y se perdían
  # preguntas. Es genérico a propósito: palabras de una clase concreta podrían inventarse.
  prompt_style: "Clase en español, con preguntas a los alumnos: ¿Qué piensan? ¿Por qué? ¿Cómo lo saben?"

voice_activity:
  threshold: 0.5                 # probabilidad de voz de Silero para marcar un frame como voz
  min_speech_duration_ms: 250    # intervalos de voz más cortos se descartan (golpes, ruidos)
  min_silence_duration_ms: 300   # silencios más cortos no cortan un intervalo de voz
  speech_pad_ms: 30              # margen pequeño: un margen grande acortaría el wait time medido

diarization:
  # Se activa solo si además existe HF_TOKEN (en .env) y se aceptaron las condiciones de los
  # modelos de pyannote en Hugging Face. Si algo falta o falla, se sigue sin diarización.
  enabled: true
  model: pyannote/speaker-diarization-3.1
  token_env_var: HF_TOKEN
  min_speakers: 2                # en un aula siempre hay al menos docente y alumnos

questions:
  # Una oración sin signos de interrogación es pregunta si empieza con alguno de estos
  interrogatives:
    - qué
    - cómo
    - por qué
    - cuál
    - cuáles
    - cuándo
    - dónde
    - quién
    - quiénes
    - cuánto
  # Whisper a veces corta una oración entre dos segmentos; se unen si la pausa es menor a esto
  join_segments_max_gap_s: 1.0
  # Muletillas (regla de respaldo si no hay LLM): una pregunta es muletilla si es solo una de
  # estas, o si termina en una de ellas después de una afirmación ("muy bien, ¿no?").
  # No cuentan como pregunta, ni para la espera, ni para el monitoreo.
  tag_words:
    - "no"
    - ya
    - cierto
    - verdad
    - sí
    - si
    - ok
    - ah
    - no es cierto

wait_time:
  min_gap_s: 0.5                 # huecos más cortos son respiración o pausas internas, no espera
  max_wait_s: 15.0               # tope: después de esto la pausa ya no es "esperar respuesta"
  # Rowe (1974, 1986): con 3 s o más de espera tras una pregunta, las respuestas de los alumnos
  # son más largas, más frecuentes y de mayor nivel cognitivo.
  ok_threshold_s: 3.0

responses:
  # Después de una pregunta del docente, la primera voz de otro hablante dentro de esta ventana
  # cuenta como respuesta de un alumno. Sin diarización, cualquier voz cuenta (certeza baja).
  response_window_s: 10.0

hallucinations:
  # Whisper inventa texto en silencios o ruido. Se descarta un segmento corto si menos de esta
  # fracción de su duración coincide con voz detectada por Silero...
  min_vad_overlap: 0.3
  # ...pero solo si tiene a lo más estas palabras: Silero no oye bien voces lejanas o bajas, y en
  # una clase real esta regla borraba respuestas largas de alumnos que sí se dijeron.
  max_words_for_vad_check: 3
  # ...o si es solo una de estas frases típicas inventadas (se comparan sin tildes ni signos).
  phrases:
    - gracias
    - gracias por ver
    - gracias por ver el video
    - suscribete
    - subtitulos realizados por la comunidad de amara org

quality:
  # Whisper entrega por segmento la log-probabilidad media y la probabilidad de "no hay voz".
  # Los mismos umbrales usa Whisper internamente para descartar segmentos dudosos.
  min_avg_logprob: -1.0
  max_no_speech_prob: 0.6

privacy:
  # Al terminar VER (antes de guardar audio_raw.json): lo que no es del docente pasa a
  # "[ALUMNO responde]" y los nombres que dice el docente, a "[NOMBRE]". Ver audio/privacy.py.
  enabled: true
  spacy_model: es_core_news_md
  # El modelo pequeño confunde etiquetas: "María" sale MISC, "Pedro" LOC y "¿Qué" o "Claro"
  # salen PER. Se tapa una entidad con estas etiquetas solo si todas sus palabras son nombres
  # propios.
  person_labels: [PER]
  proper_noun_labels: [MISC, LOC]
  # Respaldo: una palabra con mayúscula que está en esta lista también se tapa
  names_path: configs/names_pe.yaml
  # Nunca se tapan (se comparan sin tildes ni mayúsculas). Las palabras del tema tampoco.
  keep_words: [hija, hijo, hijas, hijos, niño, niña, niños, niñas, chicos, chicas, alumnos,
               profesor, profesora, miss, mamá, papá, señor, señora, comunicación, matemática,
               matemáticas, ciencia, tecnología, arte, inglés, religión, personal social,
               educación física, perú, lima, dios, felicitaciones, gracias, bien]
