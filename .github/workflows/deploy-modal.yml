name: Deploy Modal

# Despliega el worker (VER) en Modal cuando cambia el motor, el worker o los configs en main,
# y solo si la CI pasa. También se puede correr a mano (Actions -> Deploy Modal -> Run workflow).
on:
  push:
    branches: [main]
    paths:
      - "engine/**"
      - "services/worker/**"
      - "configs/**"
      - ".github/workflows/deploy-modal.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-modal
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar Modal y el motor liviano
        run: python -m pip install modal pyyaml -e engine

      - name: Actualizar el Secret de Modal (los valores nunca se imprimen)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          WORKER_TOKEN: ${{ secrets.WORKER_TOKEN }}
          UPLOAD_ACCESS_CODE: ${{ secrets.UPLOAD_ACCESS_CODE }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: python scripts/sync_modal_secrets.py

      - name: Desplegar
        run: modal deploy services/worker/modal_app.py

      - name: Revisar que /health responde y que el Volume tiene los pesos
        run: python scripts/check_modal_worker.py
